name = "horariostec-api"
main = "src/entry.py"
# Keep the Python Workers runtime on the stable Pyodide generation. The
# 2026-08 runtime currently fails validation with a dynamic `fs` require.
compatibility_date = "2026-07-28"
compatibility_flags = ["python_workers"]

[[d1_databases]]
binding = "DB"
database_name = "horariostec"
database_id = "fa38b7f7-fe69-4dae-a1e2-995abf512948"
migrations_dir = "migrations"

[vars]
# Add origins as a comma-separated list, without trailing slashes.
ALLOWED_ORIGINS = "https://horariostec.pages.dev,https://horariostec.com,http://localhost:5173,http://localhost:8787"


[dev]
ip = "0.0.0.0"
