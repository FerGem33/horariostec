[project]
name = "haztuhorario-scraper"
version = "0.1.0"
description = "HazTuHorario teacher review importer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haztuhorario"]
