[project]
name = "mindbox-scraper"
version = "0.1.0"
description = "Mindbox semester data importer for HorariosTec"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "playwright>=1.52,<2",
    "pytest>=9.1.1",
    "requests>=2.32,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]
